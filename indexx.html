<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do list</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: gray;
        }
        div {
            background-color: white;
            width: 50vw;
            margin: auto;
            margin-top: 10px;
            padding: 5%;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        #listCont {
            margin: 20px auto;
            width: 70vw;
        }
        p {
            font-size: 1.5rem;
        }
        input {
            width: 70%;
            padding: 10px;
            font-size: 1rem;
            border-radius: 5px;
            border: 1px solid black;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            border: none;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
        }
        section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid black;
            width: 100%;
            padding: 5px 10px;
        }
        section button {
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            border: none;
            background-color: green;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>To do list</h1>
    <div>
        <p>Add a task</p>
        <input type="text" id="taskInput" placeholder="Enter a task"/>
        <button onclick="addTask()">Add</button>
    </div>
    <div id="listCont">
        <!-- <section>
            <p>Task</p>
            <button onClick=removeItem()>Done</button>
        </section> -->
    </div>
    <script src="scripts.js"></script>
</body>
</html>
